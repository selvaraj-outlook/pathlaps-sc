##############################################################################
# terraform-apply.yml
#
# Manual apply - only runs when triggered by hand from the GitHub Actions UI
# (workflow_dispatch). Only available on the main branch (enforced by the
# environment protection rule - see .github/docs/oidc-setup.md).
#
# Flow:
#   1. Re-run plan to generate a fresh plan (never apply a stale plan)
#   2. Show the plan summary
#   3. Apply - runs automatically once the environment approval is given
#      (configure a "production" environment with required reviewers in
#       GitHub Settings → Environments → production)
##############################################################################
name: "Terraform Apply"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY to confirm you have reviewed the plan and want to apply"
        required: true
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.15.4"
  AWS_REGION:  "us-east-1"
  WORKING_DIR: "."

jobs:
  # --------------------------------------------------------------------------
  # Gate: only run from main, only if the user typed APPLY
  # --------------------------------------------------------------------------
  gate:
    name: "gate check"
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch is main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "❌ Apply is only allowed from the main branch."
          echo "   Current ref: ${{ github.ref }}"
          exit 1

      - name: Verify confirmation input
        if: github.event.inputs.confirm != 'APPLY'
        run: |
          echo "❌ You must type APPLY in the confirmation field to proceed."
          echo "   Got: '${{ github.event.inputs.confirm }}'"
          exit 1

      - name: Gate passed
        run: echo "✅ Gate passed — proceeding to plan + apply"

  # --------------------------------------------------------------------------
  # Plan (fresh - never apply a cached plan)
  # --------------------------------------------------------------------------
  plan:
    name: "plan (pre-apply)"
    runs-on: ubuntu-latest
    needs: gate
    environment: production    # <-- requires reviewer approval in GitHub Settings
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-apply

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color -detailed-exitcode -out=tfplan.binary 2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Show plan summary
        run: |
          echo "### Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 plan-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-apply
          path: |
            tfplan.binary
            plan-output.txt
          retention-days: 1

      - name: Fail if plan errored (exit code 1)
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "❌ Plan returned errors. Aborting apply."
          exit 1

      - name: No changes detected
        if: steps.plan.outputs.exitcode == '0'
        run: echo "✅ No changes - infrastructure is up to date. Apply will be a no-op."

  # --------------------------------------------------------------------------
  # Apply
  # --------------------------------------------------------------------------
  apply:
    name: "apply"
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-apply

      - name: Terraform init
        run: terraform init -no-color

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-apply
          path: ${{ env.WORKING_DIR }}

      - name: Terraform apply
        run: terraform apply -no-color -auto-approve tfplan.binary

      - name: Write apply summary
        if: always()
        run: |
          echo "### Apply Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
