##############################################################################
# terraform-plan.yml
#
# Runs on every pull request and on pushes to non-main branches.
# Jobs:  fmt-check → validate → plan
# Plan output is posted back as a PR comment.
# NO apply happens here — that is a separate manual workflow.
#
# Authentication:
#   OIDC role only — no static AWS keys are used anywhere in this pipeline.
#   Requires the GH_ACTIONS_ROLE_ARN secret (role deployed via
#   .github/oidc-role.yaml — see .github/docs/oidc-setup.md).
##############################################################################
name: "Terraform Plan"

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]

permissions:
  contents: read
  id-token: write        # required for OIDC
  pull-requests: write   # post plan as PR comment

env:
  TF_VERSION: "1.15.4"
  AWS_REGION: "us-east-1"
  WORKING_DIR: "."

jobs:
  # --------------------------------------------------------------------------
  # 1. Format check (no credentials needed)
  # --------------------------------------------------------------------------
  fmt-check:
    name: "fmt check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  # --------------------------------------------------------------------------
  # 2. Validate (no credentials needed — syntax check only)
  # --------------------------------------------------------------------------
  validate:
    name: "validate"
    runs-on: ubuntu-latest
    needs: fmt-check
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate -no-color

  # --------------------------------------------------------------------------
  # 3. Plan
  # --------------------------------------------------------------------------
  plan:
    name: "plan"
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # ------------------------------------------------------------------
      # OIDC — assumes GH_ACTIONS_ROLE_ARN, no static AWS keys involved
      # ------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-plan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        id: init
        run: terraform init -no-color

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -var="aws_profile=" \
            -out=tfplan.binary 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan.binary
            plan-output.txt
          retention-days: 5

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan-output.txt', 'utf8');
            const truncated = planOutput.length > 60000
              ? planOutput.slice(0, 60000) + '\n\n... [truncated — download artifact for full output]'
              : planOutput;
            const planIcon = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            const initIcon = '${{ steps.init.outcome }}' === 'success' ? '✅' : '❌';
            const body = [
              '## Terraform Plan',
              '',
              '| Step     | Result |',
              '|----------|--------|',
              `| init     | ${initIcon} |`,
              `| plan     | ${planIcon} |`,
              '',
              '<details><summary>Show Plan Output</summary>',
              '',
              '```',
              truncated,
              '```',
              '</details>',
              '',
              `*Triggered by @${{ github.actor }} — \`${{ github.ref_name }}\`*`,
            ].join('\n');
            // Remove previous bot plan comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.user.login === 'github-actions[bot]' && c.body.startsWith('## Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
