##############################################################################
# terraform-plan.yml
#
# Runs on every pull request (and on pushes to non-main branches).
# Jobs:  fmt-check → validate → plan
# The plan output is posted back as a PR comment.
# NO apply happens here - that is a separate manual workflow.
##############################################################################
name: "Terraform Plan"

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]   # catch direct pushes to feature branches too

permissions:
  contents: read          # checkout
  id-token: write         # OIDC → AssumeRoleWithWebIdentity
  pull-requests: write    # post plan as PR comment

env:
  TF_VERSION: "1.15.4"
  AWS_REGION: "us-east-1"
  WORKING_DIR: "."

jobs:
  # --------------------------------------------------------------------------
  # 1. Format check
  # --------------------------------------------------------------------------
  fmt-check:
    name: "fmt check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: false

  # --------------------------------------------------------------------------
  # 2. Validate (no AWS creds needed - just syntax check)
  # --------------------------------------------------------------------------
  validate:
    name: "validate"
    runs-on: ubuntu-latest
    needs: fmt-check
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (local only - no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

  # --------------------------------------------------------------------------
  # 3. Plan (assumes role via OIDC - no long-lived credentials stored)
  # --------------------------------------------------------------------------
  plan:
    name: "plan"
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true   # needed to capture plan output

      # Assumes the GitHub Actions OIDC role in the SharedServices account.
      # The role ARN is stored as a GitHub secret: GH_ACTIONS_ROLE_ARN
      # See .github/docs/oidc-setup.md for how to create the role.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-plan

      - name: Terraform init
        id: init
        run: terraform init -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan.binary 2>&1 | tee plan-output.txt
        continue-on-error: true   # post the output even if plan has errors

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan.binary
            plan-output.txt
          retention-days: 5

      # Post plan output as a PR comment
      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan-output.txt', 'utf8');
            const truncated = planOutput.length > 60000
              ? planOutput.slice(0, 60000) + '\n\n... [truncated - download artifact for full output]'
              : planOutput;

            const body = [
              '## Terraform Plan',
              '',
              '| Step   | Result |',
              '|--------|--------|',
              `| fmt    | ${{ steps.fmt.outcome == 'success' && '✅' || '❌' }} |`,
              `| init   | ${{ steps.init.outcome == 'success' && '✅' || '❌' }} |`,
              `| plan   | ${{ steps.plan.outcome == 'success' && '✅' || '❌' }} |`,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${{ github.actor }} on \`${{ github.ref }}\`*`,
            ].join('\n');

            // Delete previous plan comments to avoid clutter
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.startsWith('## Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
