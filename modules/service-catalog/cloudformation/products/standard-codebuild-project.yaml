AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Path Labs standard CodeBuild project - Service Catalog product. Managed
  build environment with a dedicated execution role, CloudWatch Logs output,
  and a minimal buildspec that echoes the build phase. Replace the inline
  buildspec with a buildspec.yml in your repo after provisioning.

Parameters:
  ProjectName:
    Type: String
    Description: Name of the CodeBuild project
  ComputeType:
    Type: String
    Default: BUILD_GENERAL1_SMALL
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
    Description: Build compute type (small = 3 GB RAM / 2 vCPU)
  BuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    AllowedValues:
      - aws/codebuild/standard:7.0
      - aws/codebuild/standard:6.0
      - aws/codebuild/amazonlinux2-x86_64-standard:5.0
    Description: Managed build image
  TimeoutInMinutes:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 480

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${ProjectName}"
      RetentionInDays: 30
      Tags:
        - Key: ManagedBy
          Value: ServiceCatalog

  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildBasePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}:*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: "*"
      Tags:
        - Key: ManagedBy
          Value: ServiceCatalog

  Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref ProjectName
      ServiceRole: !GetAtt ServiceRole.Arn
      TimeoutInMinutes: !Ref TimeoutInMinutes
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref ComputeType
        Image: !Ref BuildImage
        PrivilegedMode: false
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 18
            build:
              commands:
                - echo "Build started on $(date)"
                - echo "Replace this buildspec with your own buildspec.yml"
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref LogGroup
      Tags:
        - Key: ManagedBy
          Value: ServiceCatalog

Outputs:
  ProjectName:
    Value: !Ref Project
  ProjectArn:
    Value: !GetAtt Project.Arn
  ServiceRoleArn:
    Value: !GetAtt ServiceRole.Arn
