AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Path Labs standard Secrets Manager secret - Service Catalog product.
  Creates an empty secret container with an AWS-generated random value -
  never accepts a plaintext secret value as a CloudFormation parameter.

Parameters:
  SecretName:
    Type: String
    Description: Name of the secret

Resources:
  Secret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref SecretName
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: ManagedBy
          Value: ServiceCatalog

Outputs:
  SecretArn:
    Value: !Ref Secret
