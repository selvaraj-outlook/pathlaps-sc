AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Path Labs standard AWS Backup plan - Service Catalog product. Daily backup
  with 30-day retention in the default backup vault, plus an optional weekly
  copy to a second region for disaster recovery. Tag-based selection targets
  any resource tagged BackupEnabled=true.

Parameters:
  PlanName:
    Type: String
    Description: Name of the AWS Backup plan
  BackupWindowStart:
    Type: String
    Default: "03:00"
    Description: >-
      Start time of the daily backup window in HH:MM UTC (e.g. 03:00).
      The window is 2 hours long.
  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Number of days to retain daily recovery points
  EnableCrossRegionCopy:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether to copy weekly recovery points to CopyDestinationRegion.
      Requires a backup vault named Default to exist in that region.
  CopyDestinationRegion:
    Type: String
    Default: us-west-2
    Description: >-
      Region to copy weekly backups to (only used when
      EnableCrossRegionCopy = true).

Conditions:
  DoCrossRegionCopy: !Equals [!Ref EnableCrossRegionCopy, "true"]

Resources:
  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${PlanName}-backup-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
      Tags:
        - Key: ManagedBy
          Value: ServiceCatalog

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Ref PlanName
        BackupPlanRule:
          - RuleName: DailyBackup
            TargetBackupVault: Default
            ScheduleExpression: !Sub "cron(0 ${BackupWindowStart} * * ? *)"
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle:
              DeleteAfterDays: !Ref RetentionDays
            CopyActions: !If
              - DoCrossRegionCopy
              - - DestinationBackupVaultArn: !Sub "arn:aws:backup:${CopyDestinationRegion}:${AWS::AccountId}:backup-vault:Default"
                  Lifecycle:
                    DeleteAfterDays: !Ref RetentionDays
              - !Ref AWS::NoValue
      BackupPlanTags:
        ManagedBy: ServiceCatalog

  # Selects all resources tagged BackupEnabled=true
  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: TaggedResources
        IamRoleArn: !GetAtt BackupRole.Arn
        ListOfTags:
          - ConditionType: STRINGEQUALS
            ConditionKey: BackupEnabled
            ConditionValue: "true"

Outputs:
  BackupPlanId:
    Value: !Ref BackupPlan
  BackupPlanArn:
    Value: !GetAtt BackupPlan.BackupPlanArn
  BackupRoleArn:
    Value: !GetAtt BackupRole.Arn
