AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Path Labs standard CloudWatch dashboard - Service Catalog product. Purely
  a visualization resource (no permissions on any other resource) - paste
  your own dashboard widget JSON (see AWS docs for the DashboardBody schema).

Parameters:
  DashboardName:
    Type: String
  DashboardBody:
    Type: String
    Default: '{"widgets":[]}'
    Description: CloudWatch dashboard body JSON (widgets array)

Resources:
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref DashboardName
      DashboardBody: !Ref DashboardBody

Outputs:
  DashboardName:
    Value: !Ref Dashboard
